name: ROOTS DUB native regression
on:
  pull_request:
    paths:
      - "firmware/src/**"
      - "firmware/host/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/roots-dub-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install WebAssembly compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Generate firmware tables and build browser preview
        run: python3 tools/build_preview.py
      - name: Generate the UI font and icon headers for native framebuffer tests
        run: |
          sudo apt-get install -y python3-pil
          python3 tools/gen_font.py build/gen/felucca_font.h
          python3 tools/gen_icons.py build/gen/felucca_icons.h
      - name: Compare native and WebAssembly output for every engine
        run: tests/run_preview_tests.sh
      - name: Exercise the actual native FM-1 UI, including ROOTS DUB menu actions
        run: |
          mkdir -p build/host
          cc -O2 -w -Ibuild/gen -Ifirmware/src -Ifirmware/hal -o build/host/ui_pages_test tests/ui_pages_test.c -lm
          build/host/ui_pages_test build/host
      - name: Test ROOTS DUB crossover and chord behavior
        run: |
          mkdir -p build/host
          cc -O2 -w -Ifirmware/src -o build/host/roots_lr4 tests/roots_lr4_isolator_test.c -lm
          build/host/roots_lr4
          cc -O2 -w -Ibuild/gen -Ifirmware/src -o build/host/seq2 tests/seq2_test.c -lm
          build/host/seq2
          cc -O2 -w -Ibuild/gen -Ifirmware/src -o build/host/project tests/project_test.c -lm
          build/host/project
          cc -O2 -w -Ibuild/gen -Ifirmware/src -o build/host/song_audio tests/song_audio_test.c -lm
          build/host/song_audio
      - name: Verify factory sound golden renders
        run: |
          cc -O2 -w -Ibuild/gen -Ifirmware/src -o build/host/regress tests/regress.c -lm
          build/host/regress tests/golden.txt tests/cpu_baseline.txt
