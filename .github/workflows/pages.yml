name: Publish ROOTS DUB SLOOP WebAssembly emulator
on:
  workflow_run:
    workflows: ["ROOTS DUB WebAssembly emulator"]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run events can arrive out of order. Only publish a successful build
    # from the current main HEAD; never let an older run overwrite newer firmware.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Check out the source used by the successful browser build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download the tested ROOTS DUB browser emulator
        uses: actions/download-artifact@v4
        with:
          name: roots-dub-webassembly-emulator
          path: public/roots-dub
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify the browser emulator payload
        run: |
          test -s public/roots-dub/index.html
          test -s public/roots-dub/sloop.wasm
          test -s public/roots-dub/worklet.js
      - name: Preserve existing published tools and add ROOTS DUB link
        run: |
          mkdir -p public
          if [ -d web ]; then cp -R web public/web; fi
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="fr">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=./roots-dub/"><title>SLOOP ROOTS DUB</title></head>
          <body><p><a href="./roots-dub/">Ouvrir l’émulateur SLOOP ROOTS DUB</a></p></body>
          </html>
          EOF
          cat > public/roots-dub/README.txt <<'EOF'
          SLOOP ROOTS DUB browser emulator.
          This directory contains the tested SLOOP WebAssembly AudioWorklet build.
          Firmware sources and browser HAL are GPL-3.0-only.
          Upstream browser emulator: https://github.com/sabliran/sloop-web-emu
          EOF
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: roots-dub-pages-${{ github.event.workflow_run.id }}
          path: public
      - name: Retire stale GitHub Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=100" | jq -s 'add' > /tmp/pages-deployments.json
          # A previous deploy-pages job can leave a same-SHA deployment pending.
          # Retire every queued/in-progress Pages deployment before creating this one.
          jq -c '.[] | {id: .id, sha: .sha}' /tmp/pages-deployments.json |
          while read -r deployment; do
            id=$(jq -r '.id' <<< "$deployment")
            statuses=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=100" | jq -s 'add')
            state=$(jq -r '.[0].state // empty' <<< "$statuses")
            if [ "$state" = "in_progress" ] || [ "$state" = "queued" ]; then
              echo "Retiring pending Pages deployment $id ($(jq -r '.sha' <<< "$deployment"))"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" \
                -f state=inactive \
                -f description="Superseded by the latest ROOTS DUB Pages deployment" >/dev/null
            fi
          done
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: roots-dub-pages-${{ github.event.workflow_run.id }}
