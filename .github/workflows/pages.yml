name: Publish ROOTS DUB SLOOP WebAssembly emulator
on:
  workflow_run:
    workflows: ["ROOTS DUB WebAssembly emulator"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Download the tested ROOTS DUB browser emulator
        uses: actions/download-artifact@v4
        with:
          name: roots-dub-webassembly-emulator
          path: public/roots-dub
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify the browser emulator payload
        run: |
          test -s public/roots-dub/index.html
          test -s public/roots-dub/sloop.wasm
          test -s public/roots-dub/worklet.js
      - name: Keep the existing project landing page and tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Preserve existing published tools and add ROOTS DUB link
        run: |
          mkdir -p public
          if [ -f index.html ]; then cp index.html public/index.html; fi
          if [ -d web ]; then cp -R web public/web; fi
          cat > public/roots-dub/README.txt <<'EOF'
          SLOOP ROOTS DUB browser emulator.
          This directory contains the tested SLOOP WebAssembly AudioWorklet build.
          Firmware sources and browser HAL are GPL-3.0-only.
          Upstream browser emulator: https://github.com/sabliran/sloop-web-emu
          EOF
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
