name: Publish ROOTS DUB web emulator
# Requires GitHub Pages to be enabled in repository Settings > Pages (Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths:
      - "web/editor.html"
      - "web/roots-dub-lab.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static emulator site
        run: |
          mkdir -p public/web
          cp web/editor.html public/web/editor.html
          cp web/roots-dub-lab.html public/web/roots-dub-lab.html
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=./web/editor.html?mock=1&amp;roots=1">
            <title>FM1 ROOTS DUB — éditeur FM1</title>
            <style>
              body{font:16px/1.5 system-ui,sans-serif;max-width:48rem;margin:12vh auto;padding:0 1.25rem;background:#101010;color:#eee}
              a{color:#e6bd65}p{color:#bbb}
            </style>
          </head>
          <body>
            <h1>FM1 ROOTS DUB</h1>
            <p>Ouverture de l’interface FM1 simulée…</p>
            <p><a href="./web/editor.html?mock=1&amp;roots=1">Ouvrir l’éditeur FM1</a></p>
            <p><a href="./web/roots-dub-lab.html">Ouvrir séparément le laboratoire audio (sirène et isolateur)</a></p>
            <p>Dans l’éditeur, appuie sur Connect puis ouvre SOUND pour accéder aux réglages ROOTS DUB. Aucun FM1 physique n’est nécessaire.</p>
          </body>
          </html>
          EOF
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
