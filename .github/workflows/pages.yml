name: Publish ROOTS DUB web emulator
# Requires GitHub Pages to be enabled in repository Settings > Pages (Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths:
      - "web/editor.html"
      - "web/roots-dub-lab.html"
      - "web/fm1-roots-emulator.html"
      - "web/preview.js"
      - "web/preview-worklet.js"
      - "firmware/src/**"
      - "firmware/host/**"
      - "tools/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install WebAssembly compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build the actual SLOOP DSP for browser preview
        run: python3 tools/build_preview.py
      - name: Prepare static emulator site
        run: |
          mkdir -p public/web
          cp web/editor.html public/web/editor.html
          cp web/fukiai.ttf public/web/fukiai.ttf
          cp web/FUKIAI-LICENSE.txt public/web/FUKIAI-LICENSE.txt
          cp web/roots-dub-lab.html public/web/roots-dub-lab.html
          cp web/fm1-roots-emulator.html public/web/fm1-roots-emulator.html
          cp web/preview.js public/web/preview.js
          cp web/preview-worklet.js public/web/preview-worklet.js
          cp build/preview/sloop-preview.wasm public/web/sloop-preview.wasm
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=./web/fm1-roots-emulator.html">
            <title>FM1 ROOTS DUB — émulateur</title>
            <style>
              body{font:16px/1.5 system-ui,sans-serif;max-width:48rem;margin:12vh auto;padding:0 1.25rem;background:#101010;color:#eee}
              a{color:#c4df72}p{color:#bbb}
            </style>
          </head>
          <body>
            <h1>FM1 ROOTS DUB</h1>
            <p>Ouverture de la façade FM1 simulée…</p>
            <p><a href="./web/fm1-roots-emulator.html">Ouvrir la façade FM1 ROOTS DUB</a></p>
            <p><a href="./web/editor.html?mock=1&amp;roots=1">Ouvrir l’éditeur SLOOP</a></p>
            <p><a href="./web/roots-dub-lab.html">Ouvrir le laboratoire audio (sirène et isolateur)</a></p>
          </body>
          </html>
          EOF
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
