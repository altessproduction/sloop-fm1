name: Publish ROOTS DUB web emulator
# Requires GitHub Pages to be enabled in repository Settings > Pages (Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths:
      - "web/editor.html"
      - "web/roots-dub-lab.html"
      - "web/fm1-roots-emulator.html"
      - "web/preview.js"
      - "web/preview-worklet.js"
      - "firmware/src/**"
      - "firmware/host/**"
      - "tools/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install firmware and WebAssembly build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld curl xz-utils git python3-pip
          python3 -m pip install --break-system-packages Pillow
      - name: Fetch JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
      - name: Install JieLi pi32v2 toolchain
        run: sh tools/get_toolchain.sh
      - name: Build the complete SLOOP ROOTS DUB FM-1 package
        run: sh build.sh
      - name: Build the SLOOP DSP preview
        run: python3 tools/build_preview.py
      - name: Install Rust WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Fetch and build the full FM-1 hardware emulator
        run: |
          git clone https://github.com/joakimeriksson/fm1-emu.git /tmp/fm1-emu
          git -C /tmp/fm1-emu checkout 1c6e80a816f07f350aa8abbbce5f040992b219f3
          python3 tools/patch_fm1_emu.py /tmp/fm1-emu/web/main.js
          bash /tmp/fm1-emu/web/build.sh public/web/fm1-emu
          cp /tmp/fm1-emu/LICENSE public/web/fm1-emu/LICENSE-fm1-emu.txt
      - name: Prepare static emulator site
        run: |
          mkdir -p public/web public/web/firmware
          cp build/felucca.fwsc public/web/firmware/roots-dub.fwsc
          cp web/editor.html public/web/editor.html
          cp web/fukiai.ttf public/web/fukiai.ttf
          cp web/FUKIAI-LICENSE.txt public/web/FUKIAI-LICENSE.txt
          cp web/roots-dub-lab.html public/web/roots-dub-lab.html
          cp web/fm1-roots-emulator.html public/web/fm1-roots-emulator.html
          cp web/preview.js public/web/preview.js
          cp web/preview-worklet.js public/web/preview-worklet.js
          cp build/preview/sloop-preview.wasm public/web/sloop-preview.wasm
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=./web/fm1-roots-emulator.html">
            <title>FM1 ROOTS DUB — émulateur</title>
            <style>
              body{font:16px/1.5 system-ui,sans-serif;max-width:48rem;margin:12vh auto;padding:0 1.25rem;background:#101010;color:#eee}
              a{color:#c4df72}p{color:#bbb}
            </style>
          </head>
          <body>
            <h1>FM1 ROOTS DUB</h1>
            <p>Ouverture de la façade FM1 simulée…</p>
            <p><a href="./web/fm1-roots-emulator.html">Ouvrir la façade FM1 ROOTS DUB</a></p>
            <p><a href="./web/editor.html?mock=1&amp;roots=1">Ouvrir l’éditeur SLOOP</a></p>
            <p><a href="./web/roots-dub-lab.html">Ouvrir le laboratoire audio (sirène et isolateur)</a></p>
          </body>
          </html>
          EOF
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
