name: ROOTS DUB WebAssembly emulator
# Re-run the browser HAL compile gate after each compatibility fix (including the latest flash HAL mapping).
on:
  pull_request:
    paths:
      - "firmware/**"
      - "tools/**"
      - "web/**"
      - ".github/workflows/roots-dub-wasm.yml"
  push:
    branches: ["**"]
    paths:
      - "firmware/**"
      - "tools/**"
      - "web/**"
      - ".github/workflows/roots-dub-wasm.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install WebAssembly compiler and generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld git python3 python3-pip
          python3 -m pip install --break-system-packages Pillow
      - name: Compile ROOTS DUB firmware for the browser
        run: sh tools/build_wasm_emu.sh
      - name: Verify the WebAssembly module and shell
        run: |
          test -s build/sloop-web-emu/dist/sloop.wasm
          test -s build/sloop-web-emu/dist/index.html
          test -s build/sloop-web-emu/dist/worklet.js
          file build/sloop-web-emu/dist/sloop.wasm
          ls -lh build/sloop-web-emu/dist/sloop.wasm
      - name: Install browser smoke-test runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Boot ROOTS DUB in Chromium and verify LCD plus audio output
        run: |
          python3 -m http.server 8787 --directory build/sloop-web-emu/dist >/tmp/roots-dub-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 1
          done
          node tools/smoke_wasm_emu.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: roots-dub-webassembly-emulator
          path: build/sloop-web-emu/dist/
          if-no-files-found: error
          retention-days: 14
